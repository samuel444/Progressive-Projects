
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-risk-engine"
version = "0.1.0"
description = "Options pricing, volatility forecasting, Monte Carlo and portfolio risk engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arch>=7.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "nbqa>=1.8",
    "pybind11>=2.12",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
